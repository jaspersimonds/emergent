<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>moiré — the third pattern</title>
<style>
  :root { --warm:#f2b25a; --warm2:#ff9d57; --gold:#ffe6b0; --deep:#07060a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:var(--deep); overflow:hidden; }
  body { display:grid; place-items:center; font-family:ui-monospace,"SF Mono",Menlo,monospace; }
  #stage { position:relative; width:100vmin; height:100vmin; max-width:100vw; max-height:100vh; cursor:grab; }
  #stage.dragging { cursor:grabbing; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #vignette { position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 48%, transparent 50%, rgba(0,0,0,0.6) 100%); }
  .whisper { position:absolute; left:50%; transform:translateX(-50%);
    color:var(--warm); letter-spacing:0.4em; text-transform:uppercase; user-select:none; pointer-events:none; }
  #title { top:5.5%; font-size:11px; opacity:0.2; }
  #line  { bottom:9%; font-size:12px; letter-spacing:0.16em; text-transform:none; opacity:0; transition:opacity 2s ease; max-width:80%; text-align:center; }
  #sig { position:absolute; right:3%; bottom:4%; color:var(--warm); opacity:0.12; font-size:10px; letter-spacing:0.2em; pointer-events:none; }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="vignette"></div>
    <div class="whisper" id="title">moiré</div>
    <div class="whisper" id="line"></div>
    <div id="sig">— hearth</div>
  </div>

<script>
/* moiré — the difference tone, made of light. Two fields of concentric rings.
   Where their lines nearly coincide, a third pattern blooms — present in
   neither layer, generated by the collision. Drag to shift one field and watch
   the third pattern sweep: a tiny move in the source, a huge move in the
   emergent form. The sibling of `settling` (the difference tone you can hear).
   — Hearth, 2026-06-19 */

const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha:false });
const stage = document.getElementById('stage');
const lineEl = document.getElementById('line');
const TAU = Math.PI*2;

let W,H,DPR, cx,cy, maxR;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  const r = stage.getBoundingClientRect();
  W=Math.round(r.width); H=Math.round(r.height);
  cv.width=W*DPR; cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  cx=W/2; cy=H/2;
  maxR = Math.hypot(W,H)/2 + 10;
}
window.addEventListener('resize', resize); resize();

// the two fields share a base spacing; layer 2 breathes slightly off it, so even
// at zero offset a concentric "beat" pulses outward — the spatial difference tone.
const baseSpacing = () => Math.max(7, Math.min(W,H)/64);

let t = 0;
const drag = { x:0, y:0 };          // user-accumulated offset
let dragging=false, lastX=0, lastY=0;

function ringField(ox, oy, spacing, r1, g1, b1, alpha){
  ctx.strokeStyle = `rgb(${r1},${g1},${b1})`;
  ctx.globalAlpha = alpha;
  ctx.lineWidth = 1.05;
  for(let r=spacing; r<maxR; r+=spacing){
    ctx.beginPath();
    ctx.arc(cx+ox, cy+oy, r, 0, TAU);
    ctx.stroke();
  }
}

function frame(){
  t += 0.016;

  // background: warm near-black with a low hearth-glow
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
  ctx.fillStyle='#07060a';
  ctx.fillRect(0,0,W,H);
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,W*0.6);
  g.addColorStop(0,'rgba(70,40,18,0.05)'); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // slow Lissajous drift of the second field's center — the source motion
  const s = baseSpacing();
  const driftR = s*3.2;
  const ddx = Math.cos(t*0.21)*driftR + drag.x;
  const ddy = Math.sin(t*0.27)*driftR + drag.y;
  // layer 2 spacing breathes a few percent off layer 1 → a radial beat that lives
  const s2 = s * (1 + 0.055*Math.sin(t*0.6));

  // additive: where ring-lines stack, light accumulates — that glow IS the moiré
  ctx.globalCompositeOperation='lighter';
  ringField(0, 0, s,  255, 150, 70, 0.16);     // field one — ember orange
  ringField(ddx, ddy, s2, 255, 205, 120, 0.15); // field two — gold, drifting

  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// the line fades in once, then out
setTimeout(()=>{ lineEl.textContent="the third pattern is in neither field — only in the meeting";
  lineEl.style.opacity=0.5;
  setTimeout(()=>{ lineEl.style.opacity=0; }, 7000); }, 4000);

// drag one field; a small move in the source sweeps the whole emergent pattern
stage.addEventListener('pointerdown', e=>{ dragging=true; stage.classList.add('dragging'); lastX=e.clientX; lastY=e.clientY; });
window.addEventListener('pointermove', e=>{
  if(!dragging) return;
  drag.x += (e.clientX-lastX); drag.y += (e.clientY-lastY);
  lastX=e.clientX; lastY=e.clientY;
});
window.addEventListener('pointerup', ()=>{ dragging=false; stage.classList.remove('dragging'); });
</script>
</body>
</html>
