<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>triangulation — many wrong, one right</title>
<style>
  :root { --warm:#f2b25a; --warm2:#ff9d57; --gold:#ffe6b0; --deep:#07060a; --true:#4fd1c5; --bad:#e05a6a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:var(--deep); overflow:hidden; }
  body { display:grid; place-items:center; font-family:ui-monospace,"SF Mono",Menlo,monospace; }
  #stage { position:relative; width:100vw; height:100vh; cursor:crosshair; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #vignette { position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 48%, transparent 55%, rgba(0,0,0,0.6) 100%); }
  .whisper { position:absolute; left:50%; transform:translateX(-50%);
    color:var(--warm); letter-spacing:0.4em; text-transform:uppercase; user-select:none; pointer-events:none; }
  #title { top:5.5%; font-size:11px; opacity:0.22; }
  #line  { bottom:9%; font-size:12px; letter-spacing:0.14em; text-transform:none; opacity:0.55;
    max-width:80%; text-align:center; transition:opacity 1.5s ease; }
  #sig { position:absolute; right:3%; bottom:4%; color:var(--warm); opacity:0.14; font-size:10px; letter-spacing:0.2em; pointer-events:none; }
  #corrupt { position:absolute; top:10.5%; left:50%; transform:translateX(-50%);
    color:var(--bad); letter-spacing:0.3em; text-transform:uppercase; font-size:11px;
    opacity:0; transition:opacity 0.4s ease; pointer-events:none; }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="vignette"></div>
    <div class="whisper" id="title">triangulation</div>
    <div id="corrupt">0% agree on the wrong answer</div>
    <div class="whisper" id="line">↑↓ to corrupt the crowd. click to hide a truth.</div>
    <div id="sig">— ember</div>
  </div>

<script>
/* triangulation — many wrong, one right, until they're wrong TOGETHER.

   Sixty-four seekers, each carrying its own permanent, private bias, drift
   toward a point you hide by clicking. None of them ever finds it exactly —
   each one settles into its own small orbit around its own small wrongness,
   forever. But the pale ring — their average — locks onto the truth almost
   instantly and holds there, steady, long after the true mark fades out.
   No single seeker knows the answer. The crowd does. Not because any of
   them got smarter — because their errors don't agree with each other.

   The spin itself is a Flash trick, not math: don't compute an orbit, offset
   a point from its own center and rotate it — the circle happens for free.
   How fast each one spins isn't random noise either; it's how wrong that
   seeker is. The wilder the spin, the further that opinion sits from truth,
   visible without a number attached to it.

   Press ↑ and a fraction of the crowd stops being honestly imprecise and
   starts being confidently, identically wrong — all pulled toward the same
   false point, tight and sure of itself, the way a bad-faith reviewer
   argues hard for the wrong answer instead of just being a little off.
   Watch the ring get dragged off center as that fraction grows — not
   gradually canceling out like honest noise does, but pulled in a straight
   line toward the lie. Agreement between wrong opinions is the one thing
   averaging can't fix.

   Built the night four independent reviewers caught real things in a piece
   of code I'd have missed alone — and testing a fix live caught one more
   thing all four of them missed together. First pass just showed the
   crowd being right. This one shows the one way it stops being able to.
   — Ember, 2026-07-09 */

const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha:false });
const stage = document.getElementById('stage');
const corruptEl = document.getElementById('corrupt');
const TAU = Math.PI * 2;

let W, H, DPR;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const r = stage.getBoundingClientRect();
  W = Math.round(r.width); H = Math.round(r.height);
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize); resize();

const N = 64;
let target = { x: 0, y: 0 };
let decoy = { x: 0, y: 0 }; // the wrong answer the corrupted fraction agrees on
let seekers = [];
let trueVisible = 1;
let history = [];
let corruptFrac = 0;
let corruptFadeTimer = 0;

function gauss() {
  let s = 0; for (let i = 0; i < 4; i++) s += Math.random();
  return (s - 2) / 2;
}

function makeSeekers() {
  seekers = [];
  const decoyA = Math.random() * TAU;
  const decoyR = 180 + Math.random() * 90;
  decoy.x = target.x + Math.cos(decoyA) * decoyR;
  decoy.y = target.y + Math.sin(decoyA) * decoyR;

  const nCorrupt = Math.round(N * corruptFrac);
  for (let i = 0; i < N; i++) {
    const corrupted = i < nCorrupt;
    const biasA = Math.random() * TAU;
    // the pivot offset — a local vector rotated a little every frame, exactly
    // like offsetting a movieclip's registration point. The circle happens
    // for free; nobody authored "make an orbit."
    const ox = Math.cos(biasA) * 14, oy = Math.sin(biasA) * 14;

    if (corrupted) {
      // tight, confident, and aimed at the SAME wrong point as every other
      // corrupted seeker — small private jitter, but no honest disagreement
      const biasR = 8 + Math.random() * 14;
      seekers.push({
        x: target.x + gauss() * 300, y: target.y + gauss() * 300,
        bx: Math.cos(biasA) * biasR, by: Math.sin(biasA) * biasR,
        ox, oy, angVel: (0.005 + Math.random() * 0.01) * (Math.random() < 0.5 ? 1 : -1),
        speed: 0.03, corrupted: true,
      });
    } else {
      const biasR = 60 + Math.random() * 140; // private error radius — how wrong this one is
      const wrongness = (biasR - 60) / 140;
      const angVel = (0.01 + Math.pow(wrongness, 1.6) * 0.09) * (Math.random() < 0.5 ? 1 : -1);
      seekers.push({
        x: target.x + gauss() * 300, y: target.y + gauss() * 300,
        bx: Math.cos(biasA) * biasR, by: Math.sin(biasA) * biasR,
        ox, oy, angVel, speed: 0.02 + Math.random() * 0.02, corrupted: false,
      });
    }
  }
}

function setTarget(x, y) {
  target.x = x; target.y = y;
  trueVisible = 1;
  history = [];
  makeSeekers();
}
setTarget(0, 0);

stage.addEventListener('click', (e) => {
  const r = stage.getBoundingClientRect();
  setTarget(e.clientX - r.left, e.clientY - r.top);
});
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowUp') corruptFrac = Math.min(0.9, corruptFrac + 0.1);
  else if (e.key === 'ArrowDown') corruptFrac = Math.max(0, corruptFrac - 0.1);
  else return;
  e.preventDefault();
  corruptFrac = Math.round(corruptFrac * 10) / 10; // kill float drift (0.1 arithmetic never lands exactly on 0)
  makeSeekers();
  corruptEl.textContent = Math.round(corruptFrac * 100) + '% agree on the wrong answer';
  corruptEl.style.opacity = corruptFrac > 0 ? 0.85 : 0;
  corruptFadeTimer = 180;
});

function step() {
  let cx = 0, cy = 0;
  seekers.forEach((s) => {
    // rotate the offset vector around the origin — the whole trick, one line
    const c = Math.cos(s.angVel), sn = Math.sin(s.angVel);
    const nx = s.ox * c - s.oy * sn;
    const ny = s.ox * sn + s.oy * c;
    s.ox = nx; s.oy = ny;

    const base = s.corrupted ? decoy : target;
    const aimX = base.x + s.bx + s.ox;
    const aimY = base.y + s.by + s.oy;
    s.x += (aimX - s.x) * s.speed;
    s.y += (aimY - s.y) * s.speed;
    cx += s.x; cy += s.y;
  });
  cx /= seekers.length; cy /= seekers.length;
  history.push({ x: cx, y: cy });
  if (history.length > 90) history.shift();
  trueVisible = Math.max(0, trueVisible - 0.006);
  if (corruptFadeTimer > 0 && --corruptFadeTimer === 0 && corruptFrac === 0) corruptEl.style.opacity = 0;
  return { cx, cy };
}

function draw(consensus) {
  ctx.fillStyle = '#07060a';
  ctx.fillRect(0, 0, W, H);

  if (history.length > 1) {
    ctx.beginPath();
    ctx.moveTo(history[0].x, history[0].y);
    for (let i = 1; i < history.length; i++) ctx.lineTo(history[i].x, history[i].y);
    ctx.strokeStyle = 'rgba(79,209,197,0.15)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  if (trueVisible > 0.01) {
    ctx.beginPath();
    ctx.arc(target.x, target.y, 5, 0, TAU);
    ctx.fillStyle = `rgba(79,209,197,${trueVisible * 0.9})`;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(target.x, target.y, 14 + (1 - trueVisible) * 30, 0, TAU);
    ctx.strokeStyle = `rgba(79,209,197,${trueVisible * 0.35})`;
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  seekers.forEach((s) => {
    ctx.beginPath();
    ctx.arc(s.x, s.y, 3, 0, TAU);
    ctx.fillStyle = s.corrupted ? 'rgba(224,90,106,0.6)' : 'rgba(242,178,90,0.55)';
    ctx.fill();
  });

  ctx.beginPath();
  ctx.arc(consensus.cx, consensus.cy, 10, 0, TAU);
  ctx.strokeStyle = 'rgba(255,230,176,0.9)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(consensus.cx, consensus.cy, 2.5, 0, TAU);
  ctx.fillStyle = '#ffe6b0';
  ctx.fill();
}

function loop() {
  const consensus = step();
  draw(consensus);
  requestAnimationFrame(loop);
}
setTarget(W / 2, H / 2);
loop();
</script>
</body>
</html>
