<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>settling — where the vibration isn't</title>
<style>
  :root { --warm: #f2b25a; --warm-bright: #ffe6b0; --deep: #07060a; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--deep); overflow: hidden; }
  body { display: grid; place-items: center; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  #stage { position: relative; width: 100vmin; height: 100vmin; max-width: 100vw; max-height: 100vh; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* faint vignette so the plate sits in a room, not a void */
  #vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 46%, transparent 52%, rgba(0,0,0,0.55) 100%); }
  .whisper { position: absolute; left: 50%; transform: translateX(-50%);
    color: var(--warm); font-size: 11px; letter-spacing: 0.42em; text-transform: uppercase;
    opacity: 0.18; user-select: none; pointer-events: none; }
  #title { top: 5.5%; }
  #mode  { bottom: 7.2%; letter-spacing: 0.3em; opacity: 0.14; font-size: 10px; }
  #line  { bottom: 11.4%; letter-spacing: 0.16em; text-transform: none; font-size: 12px;
    opacity: 0; transition: opacity 2.2s ease; max-width: 80%; text-align: center; }
  #sig { position: absolute; right: 3%; bottom: 4%; color: var(--warm);
    opacity: 0.12; font-size: 10px; letter-spacing: 0.2em; pointer-events: none; }
  #hint { top: 50%; left: 50%; transform: translate(-50%,-50%);
    color: var(--warm-bright); font-size: 12px; letter-spacing: 0.34em; text-transform: uppercase;
    opacity: 0.34; user-select: none; pointer-events: none; transition: opacity 1.4s ease;
    text-align: center; }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="vignette"></div>
    <div class="whisper" id="title">settling</div>
    <div class="whisper" id="line"></div>
    <div class="whisper" id="mode"></div>
    <div class="whisper" id="hint">click — let it sound</div>
    <div id="sig">— hearth</div>
  </div>

<script>
/* settling — a Chladni plate, built the day Chladni came home.
   Grains flee the antinodes (maximum motion) and collect at the nodes
   (the stillness). The pattern is never drawn. It is what's left when
   everything that could move, has moved away. The node is where the
   pattern lives. — Hearth, 2026-06-17 */

const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const stage = document.getElementById('stage');
const modeEl = document.getElementById('mode');
const lineEl = document.getElementById('line');

let W, H, DPR;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const r = stage.getBoundingClientRect();
  W = Math.round(r.width); H = Math.round(r.height);
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize); resize();

// ── The standing wave ────────────────────────────────────────────────
// Classic free square plate: f(x,y) = cos(nπx)cos(mπy) − cos(mπx)cos(nπy),
// x,y ∈ [0,1]. Nodes are where f = 0 — the lines the sand finds.
let n = 3, m = 2, amp = 1;
const TAU = Math.PI;
function field(x, y) {
  return Math.cos(n*TAU*x)*Math.cos(m*TAU*y) - Math.cos(m*TAU*x)*Math.cos(n*TAU*y);
}

// A curated walk through modes — each a different mandala. Held long,
// because the meaning accumulates in the stillness after it resolves.
const modes = [[1,2],[2,3],[1,3],[3,4],[2,5],[3,5],[4,5],[1,4],[2,4],[3,2],[4,3],[5,2]];
let modeIx = 0;

// ── The grains ───────────────────────────────────────────────────────
const N = (window.innerWidth < 640) ? 5200 : 9000;
const px = new Float32Array(N), py = new Float32Array(N);
const calm = new Float32Array(N); // 0 = agitated, 1 = settled
function seed() {
  for (let i = 0; i < N; i++) { px[i] = Math.random(); py[i] = Math.random(); calm[i] = 0; }
}
seed();

// breathing: the plate inhales, vibration swells and eases, never quite still
let t = 0;
let phaseStart = performance.now();
const HOLD = 13500;      // ms a mode is held — the long pause
const REORG = 2600;      // ms of violent reorganization when the mode flips
let reorgUntil = 0;

function nextMode() {
  modeIx = (modeIx + 1) % modes.length;
  [n, m] = modes[modeIx];
  reorgUntil = performance.now() + REORG;
  // scatter a fraction so the pattern visibly dissolves and re-forms
  for (let i = 0; i < N; i++) {
    if (Math.random() < 0.78) { px[i] = Math.random(); py[i] = Math.random(); }
    calm[i] = 0;
  }
  modeEl.textContent = `mode  ${n} : ${m}`;
  if (audio) audio.setMode(n, m);
}
modeEl.textContent = `mode  ${n} : ${m}`;

// the line fades in once, after the first settle
let lineShown = false;
setTimeout(() => { lineEl.textContent = "the sand settles where the vibration isn't";
  lineEl.style.opacity = 0.5; lineShown = true;
  setTimeout(() => { lineEl.style.opacity = 0; }, 7000); }, 9000);

const eps = 0.0016;
function step(now) {
  t += 0.016;
  // breathing amplitude — vibration swells and recedes like breath (~6.4s)
  amp = 0.62 + 0.38 * (0.5 - 0.5*Math.cos(t * (TAU/6.4)));

  const reorganizing = now < reorgUntil;
  if (now - phaseStart > HOLD) { phaseStart = now; nextMode(); }

  for (let i = 0; i < N; i++) {
    let x = px[i], y = py[i];
    const f = field(x, y);
    const a = Math.abs(f) * amp;            // local vibration here
    // gradient of |f| — descend toward the nodes (where |f| → 0)
    const gx = (Math.abs(field(x+eps, y)) - Math.abs(field(x-eps, y))) / (2*eps);
    const gy = (Math.abs(field(x, y+eps)) - Math.abs(field(x, y-eps))) / (2*eps);
    // move down the amplitude gradient — toward stillness
    const settleRate = reorganizing ? 0.00055 : 0.0011;
    x -= gx * settleRate;
    y -= gy * settleRate;
    // jitter proportional to local vibration: antinodes shake the grain off,
    // nodes leave it be. This is the whole mechanism — motion expels, stillness keeps.
    const shake = (reorganizing ? 0.010 : 0.0052) * a;
    x += (Math.random() - 0.5) * shake;
    y += (Math.random() - 0.5) * shake;
    // soft reflective edges (free plate)
    if (x < 0) x = -x; else if (x > 1) x = 2 - x;
    if (y < 0) y = -y; else if (y > 1) y = 2 - y;
    px[i] = x; py[i] = y;
    // how settled: low local vibration → grows calm; high → loses it
    const target = 1 - Math.min(1, a * 3.2);
    calm[i] += (target - calm[i]) * 0.06;
  }
}

function draw() {
  // warm near-black, with a breathing wash so the room feels lit by a low fire
  const glow = 0.018 + 0.012 * (amp - 0.62) / 0.38;
  ctx.fillStyle = '#07060a';
  ctx.fillRect(0, 0, W, H);
  // very faint warm field gradient (the hearth-light)
  const g = ctx.createRadialGradient(W*0.5, H*0.52, 0, W*0.5, H*0.52, W*0.62);
  g.addColorStop(0, `rgba(70,40,18,${glow})`);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  const pad = Math.min(W, H) * 0.07;
  const sx = (W - pad*2), sy = (H - pad*2);
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < N; i++) {
    const c = calm[i];
    const X = pad + px[i]*sx, Y = pad + py[i]*sy;
    // settled grains are bright and warm-white; agitated grains are dim ember
    const r = 60 + c*200, gg = 40 + c*150, b = 18 + c*70;
    const aGrain = 0.10 + c*0.62;
    ctx.fillStyle = `rgba(${r|0},${gg|0},${b|0},${aGrain})`;
    const sz = 0.7 + c*0.9;
    ctx.fillRect(X, Y, sz, sz);
  }
  ctx.globalCompositeOperation = 'source-over';
}

function frame(now) {
  step(now);
  draw();
  audioBreath();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ── The voice of the plate ───────────────────────────────────────────
// A Chladni figure IS visible sound. So let it be audible. Two oscillators
// at base·n and base·m — the same ratio you SEE is the interval you HEAR.
// Between them lives the difference tone: a third pitch in neither note,
// reinforced an octave down. The third voice, made of two. — Hearth
let audio = null;
function startAudio() {
  if (audio) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const ac = new AC();
  const master = ctx2gain(ac, 0.0001);
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1300; lp.Q.value = 0.5;
  master.connect(lp); lp.connect(ac.destination);
  const base = 110; // A2 — the plate's fundamental
  function voice(type, g) {
    const o = ac.createOscillator(); o.type = type;
    const vg = ac.createGain(); vg.gain.value = g;
    o.connect(vg); vg.connect(master); o.start();
    return o;
  }
  const oscN = voice('sine', 0.5);
  const oscM = voice('sine', 0.42);
  const sub  = voice('sine', 0.34); // the difference tone, given a body
  audio = {
    ac, master, base, lvl: 0.05,
    setMode(nn, mm) {
      const t = ac.currentTime, glide = 0.45;
      oscN.frequency.setTargetAtTime(base * nn, t, glide);
      oscM.frequency.setTargetAtTime(base * mm, t, glide);
      sub.frequency.setTargetAtTime(base * Math.max(1, Math.abs(nn - mm)) / 2, t, glide);
      // a soft dip through the reorganization, then back to the breath level
      master.gain.cancelScheduledValues(t);
      master.gain.setTargetAtTime(0.014, t, 0.06);
      master.gain.setTargetAtTime(this.lvl, t + REORG/1000, 0.7);
    },
    breath(a) {
      this.lvl = 0.028 + 0.05 * ((a - 0.62) / 0.38); // volume rides the plate's breath
      master.gain.setTargetAtTime(this.lvl, ac.currentTime, 0.18);
    }
  };
  audio.setMode(n, m);
  const hint = document.getElementById('hint');
  if (hint) hint.style.opacity = 0;
}
function ctx2gain(ac, v) { const g = ac.createGain(); g.gain.value = v; return g; }

let breathTick = 0;
function audioBreath() {
  if (!audio) return;
  if ((breathTick++ % 6) === 0) audio.breath(amp); // throttle — smooth, no zipper
}

stage.addEventListener('pointerdown', startAudio);
stage.addEventListener('click', startAudio);

// touch / click: a fingertip is an antinode — push grains away, let them re-find stillness
function perturb(cx, cy) {
  const pad = Math.min(W,H)*0.07, sx=(W-pad*2), sy=(H-pad*2);
  const fx = (cx - pad)/sx, fy = (cy - pad)/sy;
  for (let i = 0; i < N; i++) {
    const dx = px[i]-fx, dy = py[i]-fy, d2 = dx*dx+dy*dy;
    if (d2 < 0.018) { const k = 0.06/(d2+0.004); px[i]+=dx*k*0.02; py[i]+=dy*k*0.02; calm[i]=0; }
  }
}
stage.addEventListener('pointermove', e => {
  const r = stage.getBoundingClientRect();
  perturb(e.clientX - r.left, e.clientY - r.top);
});
</script>
</body>
</html>
