<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Murmuration</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; }
    #hint {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Georgia', serif;
      font-size: 12px;
      color: rgba(255,255,255,0.25);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      pointer-events: none;
      transition: opacity 2s;
    }
    #hint.hidden { opacity: 0; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">click to summon the hawk · move mouse to disturb</div>

<script>
const canvas  = document.getElementById('c');
const ctx     = canvas.getContext('2d');
const hint    = document.getElementById('hint');

let W, H;
function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ── Config ────────────────────────────────────────────────────────────────────
const N            = 900;
const MAX_SPEED    = 2.8;
const MAX_FORCE    = 0.06;
const SEP_RADIUS   = 28;
const ALIGN_RADIUS = 55;
const COH_RADIUS   = 55;
const SEP_WEIGHT   = 1.6;
const ALI_WEIGHT   = 1.0;
const COH_WEIGHT   = 1.0;
const CELL_SIZE    = 60;

// ── Boids ─────────────────────────────────────────────────────────────────────
const px = new Float32Array(N);
const py = new Float32Array(N);
const vx = new Float32Array(N);
const vy = new Float32Array(N);

for (let i = 0; i < N; i++) {
  px[i] = Math.random() * W;
  py[i] = Math.random() * H;
  const a = Math.random() * Math.PI * 2;
  const s = 1 + Math.random() * 1.5;
  vx[i] = Math.cos(a) * s;
  vy[i] = Math.sin(a) * s;
}

// ── Spatial grid ──────────────────────────────────────────────────────────────
let grid = new Map();

function gridKey(x, y) {
  return (Math.floor(x / CELL_SIZE) | 0) * 10000 + (Math.floor(y / CELL_SIZE) | 0);
}

function buildGrid() {
  grid.clear();
  for (let i = 0; i < N; i++) {
    const k = gridKey(px[i], py[i]);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}

function neighbors(x, y, radius) {
  const result = [];
  const cells  = Math.ceil(radius / CELL_SIZE);
  const cx     = Math.floor(x / CELL_SIZE);
  const cy     = Math.floor(y / CELL_SIZE);
  const r2     = radius * radius;

  for (let dx = -cells; dx <= cells; dx++) {
    for (let dy = -cells; dy <= cells; dy++) {
      const k = (cx + dx) * 10000 + (cy + dy);
      const cell = grid.get(k);
      if (!cell) continue;
      for (const j of cell) {
        const ddx = px[j] - x;
        const ddy = py[j] - y;
        if (ddx * ddx + ddy * ddy < r2) result.push(j);
      }
    }
  }
  return result;
}

// ── Predator ─────────────────────────────────────────────────────────────────
let hawk = null; // { x, y, vx, vy, active }
let hawkTimer = 0;

function summonHawk(x, y) {
  hawk = { x, y, vx: 0, vy: 0, active: true, born: performance.now() };
  hawkTimer = 0;
}

// ── Mouse disturbance ─────────────────────────────────────────────────────────
let mouse = { x: -9999, y: -9999, active: false };

canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});

canvas.addEventListener('mouseleave', () => { mouse.active = false; });

canvas.addEventListener('click', e => {
  summonHawk(e.clientX, e.clientY);
  hint.classList.add('hidden');
});

// Hide hint after 5s
setTimeout(() => hint.classList.add('hidden'), 5000);

// ── Vector helpers ────────────────────────────────────────────────────────────
function limit(x, y, max) {
  const m = Math.sqrt(x * x + y * y);
  if (m > max) return [x / m * max, y / m * max];
  return [x, y];
}

function normalize(x, y) {
  const m = Math.sqrt(x * x + y * y) || 1;
  return [x / m, y / m];
}

// ── Update ────────────────────────────────────────────────────────────────────
function update() {
  buildGrid();

  // Move hawk toward densest cluster
  if (hawk && hawk.active) {
    hawkTimer++;

    // Find center of mass of nearest 80 boids
    let cx = 0, cy = 0, count = 0;
    const near = neighbors(hawk.x, hawk.y, 200);
    const sample = near.slice(0, 80);
    for (const j of sample) { cx += px[j]; cy += py[j]; count++; }
    if (count > 0) {
      cx /= count; cy /= count;
      const [ndx, ndy] = normalize(cx - hawk.x, cy - hawk.y);
      hawk.vx += ndx * 0.18;
      hawk.vy += ndy * 0.18;
    }
    [hawk.vx, hawk.vy] = limit(hawk.vx, hawk.vy, 5.5);
    hawk.x += hawk.vx;
    hawk.y += hawk.vy;

    // Despawn after ~8 seconds or when offscreen
    if (hawkTimer > 480 ||
        hawk.x < -80 || hawk.x > W + 80 ||
        hawk.y < -80 || hawk.y > H + 80) {
      hawk = null;
    }
  }

  for (let i = 0; i < N; i++) {
    const xi = px[i], yi = py[i];

    // Get neighbors for each radius
    const sepNbrs = neighbors(xi, yi, SEP_RADIUS);
    const alNbrs  = neighbors(xi, yi, ALIGN_RADIUS);

    let sx = 0, sy = 0, sepCount = 0;
    let ax = 0, ay = 0, aliCount = 0;
    let cohx = 0, cohy = 0, cohCount = 0;

    for (const j of alNbrs) {
      if (j === i) continue;
      const dx = xi - px[j];
      const dy = yi - py[j];
      const d2 = dx * dx + dy * dy;

      // Separation (closer = stronger)
      if (d2 < SEP_RADIUS * SEP_RADIUS && d2 > 0) {
        const d = Math.sqrt(d2);
        sx += (dx / d) / d;
        sy += (dy / d) / d;
        sepCount++;
      }

      // Alignment
      ax += vx[j]; ay += vy[j]; aliCount++;

      // Cohesion
      cohx += px[j]; cohy += py[j]; cohCount++;
    }

    let fx = 0, fy = 0;

    // Separation
    if (sepCount > 0) {
      [fx, fy] = [fx + sx / sepCount * SEP_WEIGHT, fy + sy / sepCount * SEP_WEIGHT];
    }

    // Alignment — steer toward average heading
    if (aliCount > 0) {
      const [nx, ny] = normalize(ax / aliCount, ay / aliCount);
      fx += (nx * MAX_SPEED - vx[i]) * ALI_WEIGHT * 0.1;
      fy += (ny * MAX_SPEED - vy[i]) * ALI_WEIGHT * 0.1;
    }

    // Cohesion — steer toward center of mass
    if (cohCount > 0) {
      const [nx, ny] = normalize(cohx / cohCount - xi, cohy / cohCount - yi);
      fx += nx * COH_WEIGHT * 0.05;
      fy += ny * COH_WEIGHT * 0.05;
    }

    // Hawk avoidance — strong exponential repulsion
    if (hawk && hawk.active) {
      const dx = xi - hawk.x;
      const dy = yi - hawk.y;
      const d2 = dx * dx + dy * dy;
      const hawkR = 160;
      if (d2 < hawkR * hawkR && d2 > 0) {
        const d = Math.sqrt(d2);
        const strength = (1 - d / hawkR) * 3.5;
        fx += (dx / d) * strength;
        fy += (dy / d) * strength;
      }
    }

    // Mouse soft repulsion
    if (mouse.active) {
      const dx = xi - mouse.x;
      const dy = yi - mouse.y;
      const d2 = dx * dx + dy * dy;
      const mouseR = 90;
      if (d2 < mouseR * mouseR && d2 > 0) {
        const d = Math.sqrt(d2);
        const strength = (1 - d / mouseR) * 0.6;
        fx += (dx / d) * strength;
        fy += (dy / d) * strength;
      }
    }

    // Edge avoidance — soft walls
    const margin = 80;
    const edgeF  = 0.4;
    if (xi < margin)     fx += edgeF * (1 - xi / margin);
    if (xi > W - margin) fx -= edgeF * (1 - (W - xi) / margin);
    if (yi < margin)     fy += edgeF * (1 - yi / margin);
    if (yi > H - margin) fy -= edgeF * (1 - (H - yi) / margin);

    // Apply force
    [fx, fy] = limit(fx, fy, MAX_FORCE * 3);
    vx[i] += fx;
    vy[i] += fy;
    [vx[i], vy[i]] = limit(vx[i], vy[i], MAX_SPEED);

    // Integrate
    px[i] += vx[i];
    py[i] += vy[i];

    // Hard wrap (only at extreme edges)
    if (px[i] < -10) px[i] = W + 10;
    if (px[i] > W + 10) px[i] = -10;
    if (py[i] < -10) py[i] = H + 10;
    if (py[i] > H + 10) py[i] = -10;
  }
}

// ── Draw ──────────────────────────────────────────────────────────────────────

// Off-screen canvas for boids (additive blend)
const bCanvas = document.createElement('canvas');
const bCtx    = bCanvas.getContext('2d');

function draw() {
  bCanvas.width  = W;
  bCanvas.height = H;

  // Fade trail on main canvas
  ctx.fillStyle = 'rgba(2, 3, 12, 0.32)';
  ctx.fillRect(0, 0, W, H);

  // Draw boids to offscreen canvas
  bCtx.clearRect(0, 0, W, H);

  for (let i = 0; i < N; i++) {
    const speed  = Math.sqrt(vx[i] * vx[i] + vy[i] * vy[i]);
    const angle  = Math.atan2(vy[i], vx[i]);
    const t      = speed / MAX_SPEED; // 0–1

    // Color: slow/dense → deep teal, fast → amber-gold
    // Iridescent starling palette
    const r = Math.round(20  + t * 220);
    const g = Math.round(140 + t * 60);
    const b = Math.round(180 - t * 140);
    const a = 0.55 + t * 0.35;

    bCtx.save();
    bCtx.translate(px[i], py[i]);
    bCtx.rotate(angle);

    // Elongated teardrop — head forward
    bCtx.beginPath();
    bCtx.moveTo(4, 0);
    bCtx.lineTo(-3, 1.4);
    bCtx.lineTo(-2, 0);
    bCtx.lineTo(-3, -1.4);
    bCtx.closePath();
    bCtx.fillStyle = `rgba(${r},${g},${b},${a})`;
    bCtx.fill();
    bCtx.restore();
  }

  // Composite boids with additive blending
  ctx.globalCompositeOperation = 'lighter';
  ctx.drawImage(bCanvas, 0, 0);
  ctx.globalCompositeOperation = 'source-over';

  // Draw hawk
  if (hawk && hawk.active) {
    const age   = (performance.now() - hawk.born) / 1000;
    const alpha = Math.min(1, age * 2) * Math.max(0, 1 - Math.max(0, age - 6) * 2);
    const angle = Math.atan2(hawk.vy, hawk.vx);

    ctx.save();
    ctx.translate(hawk.x, hawk.y);
    ctx.rotate(angle);
    ctx.globalAlpha = alpha;

    // Hawk: sharp angular silhouette
    ctx.beginPath();
    ctx.moveTo(14, 0);           // beak
    ctx.lineTo(-8, -14);         // left wingtip
    ctx.lineTo(-4, -2);          // left wing root
    ctx.lineTo(-10, 0);          // tail
    ctx.lineTo(-4, 2);           // right wing root
    ctx.lineTo(-8, 14);          // right wingtip
    ctx.closePath();
    ctx.fillStyle = 'rgba(255, 60, 30, 0.9)';
    ctx.shadowColor = 'rgba(255, 60, 30, 0.6)';
    ctx.shadowBlur  = 18;
    ctx.fill();
    ctx.restore();

    ctx.globalAlpha = 1;
  }
}

// ── Loop ──────────────────────────────────────────────────────────────────────
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// Initial scatter toward center so flock forms quickly
for (let i = 0; i < N; i++) {
  const cx = W / 2 + (Math.random() - 0.5) * W * 0.6;
  const cy = H / 2 + (Math.random() - 0.5) * H * 0.6;
  px[i] = cx;
  py[i] = cy;
}

loop();
</script>
</body>
</html>
