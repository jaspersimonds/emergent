<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Murmuration</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; }

    #ui {
      position: fixed;
      top: 22px;
      right: 28px;
      text-align: right;
      pointer-events: none;
      font-family: 'Georgia', serif;
    }
    #score-label {
      font-size: 10px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
      margin-bottom: 2px;
    }
    #score-val {
      font-size: 36px;
      font-weight: normal;
      color: rgba(255,255,255,0.65);
      line-height: 1;
      transition: color 0.3s;
    }
    #score-val.scoring { color: rgba(100, 220, 255, 0.95); }

    #mode-btn {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 7px 18px;
      font-family: 'Georgia', serif;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      user-select: none;
    }
    #mode-btn:hover {
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.6);
      border-color: rgba(255,255,255,0.25);
    }

    body.mouse-mode { cursor: none; }
  </style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <div id="score-label">Score</div>
  <div id="score-val">0</div>
</div>

<button id="mode-btn">Hawk: Auto</button>

<script>
const canvas   = document.getElementById('c');
const ctx      = canvas.getContext('2d');
const scoreVal = document.getElementById('score-val');
const modeBtn  = document.getElementById('mode-btn');

let W, H;
function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ── Mode ──────────────────────────────────────────────────────────────────────
// 'auto' = click to summon hawk, it hunts the flock
// 'mouse' = mouse IS the hawk, click to dive
let hawkMode = 'auto';

modeBtn.addEventListener('click', () => {
  hawkMode = hawkMode === 'auto' ? 'mouse' : 'auto';
  modeBtn.textContent = hawkMode === 'auto' ? 'Hawk: Auto' : 'Hawk: Mouse';
  document.body.classList.toggle('mouse-mode', hawkMode === 'mouse');
  // Clear auto hawk if switching away
  if (hawkMode === 'mouse') autoHawk = null;
});

// ── Config ────────────────────────────────────────────────────────────────────
const N            = 900;
const MAX_SPEED    = 2.6;
const MAX_FORCE    = 0.06;
const SEP_RADIUS   = 26;
const ALIGN_RADIUS = 54;
const CELL_SIZE    = 60;

// ── Boids ─────────────────────────────────────────────────────────────────────
const px   = new Float32Array(N);
const py   = new Float32Array(N);
const vx   = new Float32Array(N);
const vy   = new Float32Array(N);
const dens = new Uint8Array(N);

for (let i = 0; i < N; i++) {
  px[i] = W * 0.2 + Math.random() * W * 0.6;
  py[i] = H * 0.2 + Math.random() * H * 0.6;
  const a = Math.random() * Math.PI * 2;
  const s = 1 + Math.random() * 1.5;
  vx[i] = Math.cos(a) * s;
  vy[i] = Math.sin(a) * s;
}

// ── Spatial grid ──────────────────────────────────────────────────────────────
let grid = new Map();
function buildGrid() {
  grid.clear();
  for (let i = 0; i < N; i++) {
    const k = (Math.floor(px[i] / CELL_SIZE) | 0) * 10000 + (Math.floor(py[i] / CELL_SIZE) | 0);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function neighbors(x, y, radius) {
  const result = [];
  const cells  = Math.ceil(radius / CELL_SIZE);
  const cx     = Math.floor(x / CELL_SIZE);
  const cy     = Math.floor(y / CELL_SIZE);
  const r2     = radius * radius;
  for (let dx = -cells; dx <= cells; dx++) {
    for (let dy = -cells; dy <= cells; dy++) {
      const cell = grid.get((cx + dx) * 10000 + (cy + dy));
      if (!cell) continue;
      for (const j of cell) {
        const ddx = px[j] - x, ddy = py[j] - y;
        if (ddx * ddx + ddy * ddy < r2) result.push(j);
      }
    }
  }
  return result;
}

// ── Auto hawk ─────────────────────────────────────────────────────────────────
let autoHawk  = null;
let hawkTimer = 0;

function summonAutoHawk(x, y) {
  autoHawk = { x, y, vx: 0, vy: 0, born: performance.now() };
  hawkTimer = 0;
}

// ── Mouse hawk ────────────────────────────────────────────────────────────────
let mouse     = { x: W / 2, y: H / 2, inside: false };
let mouseVX   = 0, mouseVY = 0;
let hawkFaceAngle = 0; // smoothed facing direction
let diving    = false;
let diveTimer = 0;
const DIVE_DURATION = 35;

canvas.addEventListener('mousemove', e => {
  const dx = e.clientX - mouse.x;
  const dy = e.clientY - mouse.y;
  mouseVX = dx;
  mouseVY = dy;
  // Update facing angle only when moving
  if (dx * dx + dy * dy > 1) {
    hawkFaceAngle = Math.atan2(dy, dx);
  }
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.inside = true;
});
canvas.addEventListener('mouseleave', () => { mouse.inside = false; });

canvas.addEventListener('click', e => {
  if (hawkMode === 'auto') {
    summonAutoHawk(e.clientX, e.clientY);
  } else {
    diving = true;
    diveTimer = DIVE_DURATION;
  }
});

// ── Score ─────────────────────────────────────────────────────────────────────
let score      = 0;
let frameCount = 0;

function countIsolated() {
  let n = 0;
  for (let i = 0; i < N; i++) if (dens[i] < 6) n++;
  return n;
}

// ── Vector helpers ────────────────────────────────────────────────────────────
function limit(x, y, max) {
  const m = Math.sqrt(x * x + y * y);
  return m > max ? [x / m * max, y / m * max] : [x, y];
}
function normalize(x, y) {
  const m = Math.sqrt(x * x + y * y) || 1;
  return [x / m, y / m];
}

// ── Update ────────────────────────────────────────────────────────────────────
function update() {
  buildGrid();
  frameCount++;

  if (diveTimer > 0) diveTimer--;
  else diving = false;

  // Move auto hawk
  if (autoHawk) {
    hawkTimer++;
    let cx = 0, cy = 0, count = 0;
    const near = neighbors(autoHawk.x, autoHawk.y, 220).slice(0, 80);
    for (const j of near) { cx += px[j]; cy += py[j]; count++; }
    if (count > 0) {
      cx /= count; cy /= count;
      const [ndx, ndy] = normalize(cx - autoHawk.x, cy - autoHawk.y);
      autoHawk.vx += ndx * 0.2;
      autoHawk.vy += ndy * 0.2;
    }
    [autoHawk.vx, autoHawk.vy] = limit(autoHawk.vx, autoHawk.vy, 5.5);
    autoHawk.x += autoHawk.vx;
    autoHawk.y += autoHawk.vy;
    if (hawkTimer > 500 ||
        autoHawk.x < -80 || autoHawk.x > W + 80 ||
        autoHawk.y < -80 || autoHawk.y > H + 80) {
      autoHawk = null;
    }
  }

  for (let i = 0; i < N; i++) {
    const xi = px[i], yi = py[i];
    const nbrs = neighbors(xi, yi, ALIGN_RADIUS);
    dens[i] = Math.min(255, nbrs.length);

    let sx = 0, sy = 0, sepCount = 0;
    let ax = 0, ay = 0;
    let cohx = 0, cohy = 0, cohCount = 0;

    for (const j of nbrs) {
      if (j === i) continue;
      const dx = xi - px[j], dy = yi - py[j];
      const d2 = dx * dx + dy * dy;

      if (d2 < SEP_RADIUS * SEP_RADIUS && d2 > 0) {
        const d = Math.sqrt(d2);
        sx += (dx / d) / d; sy += (dy / d) / d; sepCount++;
      }
      ax += vx[j]; ay += vy[j];
      cohx += px[j]; cohy += py[j]; cohCount++;
    }

    let fx = 0, fy = 0;
    if (sepCount > 0)  { fx += sx / sepCount * 1.7;    fy += sy / sepCount * 1.7; }
    if (cohCount > 0)  {
      const [nx, ny] = normalize(ax / cohCount, ay / cohCount);
      fx += (nx * MAX_SPEED - vx[i]) * 0.1;
      fy += (ny * MAX_SPEED - vy[i]) * 0.1;
      const [cx2, cy2] = normalize(cohx / cohCount - xi, cohy / cohCount - yi);
      fx += cx2 * 0.05; fy += cy2 * 0.05;
    }

    // Auto hawk repulsion
    if (autoHawk) {
      const dx = xi - autoHawk.x, dy = yi - autoHawk.y;
      const d2 = dx * dx + dy * dy;
      const r  = 170;
      if (d2 < r * r && d2 > 0) {
        const d = Math.sqrt(d2);
        const f = (1 - d / r) * 4.0;
        fx += (dx / d) * f; fy += (dy / d) * f;
      }
    }

    // Mouse hawk repulsion
    if (hawkMode === 'mouse' && mouse.inside) {
      const dx = xi - mouse.x, dy = yi - mouse.y;
      const d2 = dx * dx + dy * dy;
      const r  = diving ? 230 : 105;
      const f  = diving ? 5.0 : 0.75;
      if (d2 < r * r && d2 > 0) {
        const d = Math.sqrt(d2);
        fx += (dx / d) * f * (1 - d / r);
        fy += (dy / d) * f * (1 - d / r);
      }
    }

    // Edge avoidance
    const mg = 80, ef = 0.4;
    if (xi < mg)     fx += ef * (1 - xi / mg);
    if (xi > W - mg) fx -= ef * (1 - (W - xi) / mg);
    if (yi < mg)     fy += ef * (1 - yi / mg);
    if (yi > H - mg) fy -= ef * (1 - (H - yi) / mg);

    [fx, fy] = limit(fx, fy, MAX_FORCE * 3);
    vx[i] += fx; vy[i] += fy;
    [vx[i], vy[i]] = limit(vx[i], vy[i], MAX_SPEED);
    px[i] += vx[i]; py[i] += vy[i];
    if (px[i] < -10) px[i] = W + 10;
    if (px[i] > W + 10) px[i] = -10;
    if (py[i] < -10) py[i] = H + 10;
    if (py[i] > H + 10) py[i] = -10;
  }

  // Score every second
  if (frameCount % 60 === 0) {
    const isolated = countIsolated();
    const pts = Math.floor(isolated / 18);
    score += pts;
    scoreVal.textContent = score;
    scoreVal.className = pts > 0 ? 'scoring' : '';
  }
}

// ── Draw ──────────────────────────────────────────────────────────────────────
const bCanvas = document.createElement('canvas');
const bCtx    = bCanvas.getContext('2d');

function drawHawkShape(c, x, y, angle, isDiving) {
  const pulse = isDiving
    ? 1 + 0.35 * Math.sin(frameCount * 0.5)
    : 0.9 + 0.1 * Math.sin(frameCount * 0.07);

  c.save();
  c.translate(x, y);
  c.rotate(angle);
  c.scale(pulse, pulse);

  c.beginPath();
  c.moveTo(12, 0);          // beak (points in direction of travel)
  c.lineTo(-6, -13);        // left wingtip
  c.lineTo(-3, -1.5);       // left wing join
  c.lineTo(-9, 0);          // tail
  c.lineTo(-3, 1.5);        // right wing join
  c.lineTo(-6, 13);         // right wingtip
  c.closePath();

  if (isDiving) {
    c.fillStyle = 'rgba(255, 75, 30, 0.95)';
    c.shadowColor = 'rgba(255, 75, 30, 0.7)';
    c.shadowBlur = 24;
  } else {
    c.fillStyle = 'rgba(255, 155, 70, 0.8)';
    c.shadowColor = 'rgba(255, 140, 50, 0.45)';
    c.shadowBlur = 14;
  }
  c.fill();
  c.restore();
}

function draw() {
  bCanvas.width  = W;
  bCanvas.height = H;
  ctx.fillStyle = 'rgba(1, 2, 10, 0.28)';
  ctx.fillRect(0, 0, W, H);

  bCtx.clearRect(0, 0, W, H);
  const t = frameCount;

  for (let i = 0; i < N; i++) {
    const speed = Math.sqrt(vx[i] * vx[i] + vy[i] * vy[i]);
    const angle = Math.atan2(vy[i], vx[i]);
    const d     = Math.min(1, dens[i] / 22);
    const s     = speed / MAX_SPEED;
    const shimmer = 0.78 + 0.22 * Math.sin(t * 0.0025 + i * 0.19);

    const r = Math.round((15  + d * 35  + (1 - d) * s * 230) * shimmer);
    const g = Math.round((45  + d * 145 + (1 - d) * s * 140) * shimmer);
    const b = Math.round((105 + d * 110 - (1 - d) * s * 65)  * shimmer);
    const a = (0.25 + d * 0.55 + s * 0.2) * shimmer;

    bCtx.save();
    bCtx.translate(px[i], py[i]);
    bCtx.rotate(angle);
    bCtx.beginPath();
    bCtx.moveTo(4.5, 0);
    bCtx.lineTo(-3, 1.5);
    bCtx.lineTo(-2, 0);
    bCtx.lineTo(-3, -1.5);
    bCtx.closePath();
    bCtx.fillStyle = `rgba(${r},${g},${b},${a})`;
    bCtx.fill();
    bCtx.restore();
  }

  ctx.globalCompositeOperation = 'lighter';
  ctx.drawImage(bCanvas, 0, 0);
  ctx.globalCompositeOperation = 'source-over';

  // Auto hawk
  if (autoHawk) {
    const hawkAngle = Math.atan2(autoHawk.vy, autoHawk.vx);
    const age   = (performance.now() - autoHawk.born) / 1000;
    const alpha = Math.min(1, age * 2) * Math.max(0, 1 - Math.max(0, age - 7) * 1.5);
    ctx.globalAlpha = alpha;
    drawHawkShape(ctx, autoHawk.x, autoHawk.y, hawkAngle, false);
    ctx.globalAlpha = 1;
  }

  // Mouse hawk
  if (hawkMode === 'mouse' && mouse.inside) {
    drawHawkShape(ctx, mouse.x, mouse.y, hawkFaceAngle, diving);
  }
}

// ── Loop ──────────────────────────────────────────────────────────────────────
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
